name: PR review get env vars

on:
  push:
    branches:
      - main
    paths:
      - "terraform/aws/**"
      - "terraform/env/**"
      - ".github/workflows/pr-review-get-vars.yml"
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1

permissions:
  id-token: write
  contents: read

jobs:
  pr-review-get-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
          DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
          DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
          DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
          DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
          DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/platform-unified-accounts-pr-review-get-vars
          role-session-name: PRReviewGetEnvVars
          aws-region: ${{ env.AWS_REGION }}

      - name: Get environment variables
        env:
          CLUSTER_NAME: idp
          SERVICE_NAME: idp-login
        run: |
          .github/workflows/scripts/pr-review-get-vars.sh "$CLUSTER_NAME" "$SERVICE_NAME" > /dev/null 2>&1
