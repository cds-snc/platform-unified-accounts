name: Docker SBOM Staging

on:
  workflow_call:
    inputs:
      GITHUB_REF:
        required: true
        type: string
    secrets:
      SENTINEL_DCE_ENDPOINT:
        required: true

permissions:
  contents: write
  id-token: write
  
jobs:
  docker-sbom:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image:
          - alarms-slack
          - idp
          - idp-cleanup-users
          - idp-event-exporter
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
        DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
        DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
        DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
        DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
        DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"
  
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.GITHUB_REF }}

    - name: Build image
      run: |
        docker build \
          --platform linux/arm64 \
          --tag "${{ matrix.image }}:latest" \
          --file ./docker/${{ matrix.image }}/Dockerfile \
          ./docker/${{ matrix.image }}

    - name: Generate Docker image SBOM
      uses: cds-snc/security-tools/.github/actions/generate-sbom@d123fa2b895f7ef5b400fad333d2101b103b2e64 # v4.0.4
      env:
        TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
      with:
        docker_image: "${{ matrix.image }}"
        dockerfile_path: "./docker/${{ matrix.image }}/Dockerfile"
        token: "${{ secrets.GITHUB_TOKEN }}"
        platform: "linux/arm64"