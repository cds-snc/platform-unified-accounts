name: Docker deploy Staging

on:
  workflow_call:
    secrets:
      LOG_ANALYTICS_WORKSPACE_ID:
        required: true
      LOG_ANALYTICS_WORKSPACE_KEY:
        required: true

env: 
  AWS_REGION: ca-central-1
  ECS_CLUSTER: idp
  REGISTRY_PREFIX: ${{ vars.STAGING_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com
  GITHUB_SHA: ${{ github.sha }}

permissions:
  id-token: write

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: alarms-slack
            type: lambda
          - name: idp
            type: ecs
          - name: idp-cleanup-users
            type: lambda
          - name: idp-event-exporter
            type: lambda

    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
        DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/platform-unified-accounts-docker-deploy
        role-session-name: DeployContainer
        aws-region: ${{ env.AWS_REGION }}

    - name: Update Lambda
      if: matrix.service.type == 'lambda'
      run: |
        aws lambda update-function-code \
          --function-name ${{ matrix.service.name }} \
          --image-uri $REGISTRY_PREFIX/${{ matrix.service.name }}:sha-${{ env.GITHUB_SHA }} > /dev/null 2>&1
        aws lambda wait function-updated \
          --function-name ${{ matrix.service.name }} > /dev/null 2>&1

    - name: Update ECS task image
      if: matrix.service.type == 'ecs'
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
      with:
        task-definition-family: ${{ matrix.service.name }}
        container-name: ${{ matrix.service.name }}
        image: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ env.GITHUB_SHA }}

    - name: Deploy updated ECS task
      if: matrix.service.type == 'ecs'
      uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ matrix.service.name }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        propagate-tags: SERVICE

    - name: Update SSM parameter for deployed image
      if: matrix.service.type == 'ecs'
      run: |
        aws ssm put-parameter \
          --name "/ecs/${{ env.ECS_CLUSTER }}/${{ matrix.service.name }}/container-image" \
          --value "${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ env.GITHUB_SHA }}" \
          --type "String" \
          --overwrite
