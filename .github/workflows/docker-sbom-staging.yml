name: Docker SBOM Staging

on:
  workflow_call:
    secrets:
      LOG_ANALYTICS_WORKSPACE_ID:
        required: true
      LOG_ANALYTICS_WORKSPACE_KEY:
        required: true

permissions:
  contents: write
  
jobs:
  docker-sbom:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image:
          - alarms-slack
          - idp
          - idp-cleanup-users
          - idp-event-exporter
    
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
        DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"
  
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: changes
      with:
        filters: |
          docker:
            - './docker/${{ matrix.image }}/**'

    - name: Exit if no changes
      if: steps.changes.outputs.docker == 'false'
      run: exit 0

    - name: Build image
      run: |
        docker build \
          --platform linux/arm64 \
          --tag "${{ matrix.image }}:latest" \
          --file ./docker/${{ matrix.image }}/Dockerfile \
          ./docker/${{ matrix.image }}

    - name: Generate Docker image SBOM
      uses: cds-snc/security-tools/.github/actions/generate-sbom@d123fa2b895f7ef5b400fad333d2101b103b2e64 # v4.0.4
      env:
        TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
      with:
        docker_image: "${{ matrix.image }}"
        dockerfile_path: "./docker/${{ matrix.image }}/Dockerfile"
        token: "${{ secrets.GITHUB_TOKEN }}"
        platform: "linux/arm64"