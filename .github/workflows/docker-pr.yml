
name: Docker Pull Request
on:
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker-pr.yml"

env: 
  REGISTRY_PREFIX: ${{ vars.STAGING_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com

permissions:
  contents: read
  pull-requests: write

jobs:
  docker-build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image:
          - alarms-slack
          - idp
          - idp-cleanup-users
          - idp-event-exporter

    steps: 
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docker:
              - './docker/${{ matrix.image }}/**'
              - '.github/workflows/docker-pr.yml'

      - name: Exit if no changes
        if: steps.changes.outputs.docker == 'false'
        run: exit 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Test
        working-directory: ./docker/${{ matrix.image }}
        run: |
          make pull_request

