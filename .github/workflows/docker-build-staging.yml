name: Docker build and push Staging

concurrency:
  group: docker-build-staging
  cancel-in-progress: false


on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-build-staging.yml"
      - ".github/workflows/docker-deploy.yml"
      - ".github/workflows/docker-sbom.yml"

env: 
  AWS_REGION: ca-central-1
  REGISTRY_PREFIX: ${{ vars.STAGING_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com
  GITHUB_SHA: ${{ github.sha }}

permissions: {}
  
jobs:
  docker-push:
    permissions:
      id-token: write
      contents: read
    outputs:
      IMAGE_TAG: ${{ steps.set-image-tag.outputs.IMAGE_TAG }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image:
          - alarms-slack
          - idp
          - idp-cleanup-users
          - idp-event-exporter
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
        DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
        DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
        DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
        DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
        DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"
  
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          docker:
            - './docker/${{ matrix.image }}/**'

    - name: Exit if no changes
      if: steps.changes.outputs.docker == 'false'
      run: exit 0

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/platform-unified-accounts-docker-push
        role-session-name: PushContainer
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7 
  
    - name: Build and push image
      run: |
        docker buildx build \
          --push \
          --provenance=false \
          --platform linux/arm64 \
          --tag "$REGISTRY_PREFIX/${{ matrix.image }}:sha-$GITHUB_SHA" \
          --file ./docker/${{ matrix.image }}/Dockerfile \
          ./docker/${{ matrix.image }}

    - name: Set IMAGE_TAG output
      id: set-image-tag
      run: echo "IMAGE_TAG=sha-$GITHUB_SHA" >> $GITHUB_OUTPUT

  docker-deploy:
    permissions:
      id-token: write
    needs: docker-push
    uses: ./.github/workflows/docker-deploy.yml
    with:
      ACCOUNT_ID: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ needs.docker-push.outputs.IMAGE_TAG }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  docker-sbom:
    permissions:
      contents: write
      id-token: write
    needs: docker-push
    uses: ./.github/workflows/docker-sbom.yml
    with:
      GITHUB_REF: ${{ github.sha }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  workflow-failure:
    needs: [docker-push, docker-deploy]
    if: failure()
    permissions:
      id-token: write
    uses: ./.github/workflows/workflow-failure.yml
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAGING_CLOUDWATCH_ALERT_SLACK_WEBHOOK }}
